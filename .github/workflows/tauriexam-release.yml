name: TauriExam Release

on:
  workflow_dispatch:
  watch:
    types:
      - started

permissions:
  contents: write

env:
  # pdfium-binaries release tag — pin to a known good version
  # https://github.com/bblanchon/pdfium-binaries/releases
  PDFIUM_RELEASE: chromium/7857

jobs:
  build-windows:
    if: github.event_name == 'workflow_dispatch' || github.event.sender.login == github.repository_owner
    name: Build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: TauriExam/package-lock.json

      - name: Setup Rust toolchain
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Download pdfium binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p TauriExam/src-tauri/resources
          mkdir -p pdfium-download
          curl -fL -o pdfium-download/pdfium-win-x64.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/pdfium-win-x64.tgz"
          tar -xzf pdfium-download/pdfium-win-x64.tgz -C pdfium-download
          if [ -f pdfium-download/bin/pdfium.dll ]; then
            cp pdfium-download/bin/pdfium.dll TauriExam/src-tauri/resources/pdfium.dll
          elif [ -f pdfium-download/lib/pdfium.dll ]; then
            cp pdfium-download/lib/pdfium.dll TauriExam/src-tauri/resources/pdfium.dll
          else
            echo "::error::pdfium.dll not found inside tarball. Contents:"
            find pdfium-download -maxdepth 3 -type f
            exit 1
          fi
          ls -la TauriExam/src-tauri/resources

      - name: Install npm dependencies
        working-directory: TauriExam
        run: npm ci

      - name: Build Tauri app
        working-directory: TauriExam
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Stage release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging
          find TauriExam/src-tauri/target/x86_64-pc-windows-msvc/release/bundle \
            \( -name '*.msi' -o -name '*-setup.exe' \) -print -exec cp {} staging/ \;
          ls -la staging

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TauriExam-windows-x64
          path: staging/*
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' || github.event.sender.login == github.repository_owner
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: tauriexam-v0.1.${{ github.run_number }}
      RELEASE_NAME: TauriExam v0.1.${{ github.run_number }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name '*.msi' -o -name '*-setup.exe' \) \
            -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-assets/* \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_NAME" \
            --notes "TauriExam Windows 自动构建（MSI + NSIS）。macOS 版请去 'TauriExam Release (macOS)' 工作流手动触发。"
