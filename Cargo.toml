[package]
name = "docintel-md"
version = "0.1.0"
edition = "2021"
description = "Tiny Azure Document Intelligence REST CLI that converts PDF/images to Markdown and JSON deliverables."

[dependencies]
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
